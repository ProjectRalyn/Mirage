# Mirage OpenSSH Frontline Reverse Proxy, Pre-Auth CVE Shield & Configurable Defense Engine
rotation_interval_secs = 300
persona_slots = 16
master_seed = 5569087846241357903
max_tarpit_connections = 1024
canary_webhook_url = "https://canary.internal.example.com/alert"

[sigil]
# Zero-allocation heuristic inspection (~85ns benign fast-path) on SSH banners and pre-NEWKEYS KEX packets
enabled = true
min_confidence = 0.55
overflow_warn_len = 2048
overflow_crit_len = 8192
inspect_ssh_banners = true
inspect_kex_packets = true

[ssh]
# Public listener in front of real OpenSSH (`upstream_sshd_addr`)
bind_addr = "0.0.0.0:22"
upstream_sshd_addr = "127.0.0.1:22022"
trusted_client_ips = []
scanner_ssh_banners = ["masscan", "zgrab", "libssh2", "paramiko", "go-ssh", "SSH-2.0-Go", "asyncssh", "JSCH", "PuTTY_Release_0.64"]

# Per-Category Configurable Response Policies:
#   "fail2ban"        -> Ban IP in memory for `quarantine_secs` (0-CPU instant drop) + emit MIRAGE_BAN log
#   "ssh_honeypot"    -> Seamlessly divert into pure-Rust SSH-2 honeypot (using exact cached upstream banner)
#   "endlessh_tarpit" -> Trap in slow pre-banner Endlessh drip loop
#   "drop"            -> Close only the offending connection immediately
bruteforce_action = "fail2ban"
cve_exploit_action = "ssh_honeypot"
scanner_action = "endlessh_tarpit"
# Optional file to append `MIRAGE_BAN` lines for host-level Fail2Ban / nftables sync:
# ban_log_file = "/var/log/mirage-bans.log"

# Pre-Auth OpenSSH CVE Shield (CVE-2024-6387 regreSSHion, CVE-2025-26466 PING DoS, CVE-2023-48795 Terrapin, CVE-2023-25136)
preauth_timeout_secs = 15
max_banner_bytes = 255
max_preauth_packet_bytes = 35000
max_preauth_packets = 8
max_kex_namelist_bytes = 4096
strict_kex_enforcement = true

# Anti-CC / DoS & Brute-Force Anomaly Detection (fixed-cap O(1) memory, OOM-proof)
max_total_connections = 4096
max_preauth_connections = 256
max_connections_per_ip = 16
max_honeypot_sessions = 256
max_honeypot_per_ip = 4
rate_window_secs = 60
max_conns_per_ip_window = 12
bruteforce_short_session_secs = 8
bruteforce_short_sessions_threshold = 5
quarantine_secs = 600

# Honeypot / Tarpit Tuning
endlessh_drip_interval_ms = 4000
accept_password_on_attempt = 3
auth_fail_delay_ms = 1200
honeypot_idle_timeout_secs = 60
honeypot_max_duration_secs = 300
